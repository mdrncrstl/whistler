[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.capture-demo-lead]
enabled = true
verify_jwt = true
import_map = "./functions/capture-demo-lead/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/capture-demo-lead/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/capture-demo-lead/*.html" ]

[functions.masterdeck-auth-email]
enabled = true
# Supabase Auth signs this request with SEND_EMAIL_HOOK_SECRET; the function
# performs its own webhook verification rather than using a user JWT.
verify_jwt = false
entrypoint = "./functions/masterdeck-auth-email/index.ts"

[functions.masterdeck-snaptrade]
enabled = true
verify_jwt = true
import_map = "./functions/masterdeck-snaptrade/deno.json"
entrypoint = "./functions/masterdeck-snaptrade/index.ts"
